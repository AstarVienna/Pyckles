[project]
name = "Pyckles"
version = "0.7.1.dev0"
description = "Simple interface to the Pickles 1998 stellar spectra catalogue."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Kieran Leschinski", email = "kieran.leschinski@univie.ac.at"}
]
maintainers = [
    { name = "Kieran Leschinski", email = "kieran.leschinski@univie.ac.at" },
    { name = "Hugo Buddelmeijer", email = "hugo@buddelmeijer.nl" },
    { name = "Fabian Haberhauer", email = "fabian.haberhauer@univie.ac.at" },
]
keywords = [ "astronomy" ]
dynamic = [ "classifiers" ]
requires-python = ">=3.12,<3.15"
dependencies = [
    "astropy (>=8.0.1,<9.0.0)",
    "pooch (>=1.9.0,<2.0.0)",
]

[project.optional-dependencies]
syn = [ "synphot>=1.5.0,<2.0.0" ]

[project.urls]
Repository = "https://github.com/AstarVienna/Pyckles/"
Documentation = "https://pyckles.readthedocs.io/"
"Bug Tracker" = "https://github.com/AstarVienna/Pyckles/issues"
Changelog = "https://github.com/AstarVienna/Pyckles/blob/main/CHANGELOG.md"


[tool.poetry]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
numpy = "^2.2.6"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
sphinx-book-theme = "^1.4.0"
sphinx-copybutton = ">=0.5.2,<1.0"
sphinxcontrib-apidoc = ">=0.6.0,<1.0"
sphinxcontrib-mermaid = "^2.1.0"
myst-nb = "^1.4.0"
sphinx-issues = "^6.0.0"
numpy = "^2.2.6"
numpydoc = "^1.10.0"
matplotlib = "^3.11.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "webtest: marks tests as requiring network (deselect with '-m \"not webtest\"')",
]

[tool.coverage.report]
omit = ["pyckles/tests/*"]
